<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AI-Image Investigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version('css/style.css') }}">
<style>
  .login-shell {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }
  .login-card {
    width: 380px; background: linear-gradient(160deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--border-soft);
    border-radius: 10px; padding: 36px 32px;
    box-shadow: var(--shadow-lg), 0 0 60px rgba(79,134,198,.08);
    animation: cardRise .4s ease;
  }
  @keyframes cardRise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .login-brand { display:flex; align-items:center; gap:12px; margin-bottom: 26px; }
  .login-title { font-size: 15.5px; font-weight: 700; letter-spacing: -.1px; }
  .login-sub { font-size: 11px; color: var(--text-low); text-transform: uppercase; letter-spacing:.6px; margin-top:3px; }
  .login-field { margin-bottom: 16px; }
  .login-field label { display:block; font-size: 11.5px; color: var(--text-low); margin-bottom: 7px; font-weight: 500; }
  .login-field input {
    width: 100%; background: var(--bg-0); border: 1px solid var(--border);
    color: var(--text-hi); padding: 11px 13px; border-radius: var(--radius-sm); font-size: 13px;
    box-shadow: var(--shadow-inset);
    transition: border-color .15s, box-shadow .15s;
  }
  .login-field input:focus { outline: none; border-color: var(--accent); box-shadow: var(--shadow-glow); }
  .login-btn {
    width: 100%; margin-top: 8px;
    background: linear-gradient(150deg, var(--accent-hi), var(--accent-dim));
    color: #fff; border: none;
    padding: 12px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600; cursor: pointer;
    box-shadow: var(--shadow-md), 0 0 0 1px rgba(255,255,255,.06) inset;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg), var(--shadow-glow); }
  .login-btn:active { transform: translateY(0); }
  .login-error {
    font-size: 12px; color: var(--red); background: var(--red-bg); border-left: 2px solid var(--red);
    padding: 9px 11px; border-radius: 3px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
  }
</style>
</head>
<body>
  <div class="bg-atmosphere">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">Ⅲ</div>
        <div>
          <div class="login-title">AI-Image Investigator</div>
          <div class="login-sub">Restricted Access</div>
        </div>
      </div>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <form method="POST" action="{{ url_for('login') }}">
        <div class="login-field">
          <label>Username</label>
          <input type="text" name="username" autofocus required />
        </div>
        <div class="login-field">
          <label>Password</label>
          <input type="password" name="password" required />
        </div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
